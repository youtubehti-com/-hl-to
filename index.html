<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Pro - Revenue Edition</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --p: #e2d1f9; --pk: #ffdae9; --g: #ffd700; --b: #00d2ff;
            --bg: #0b141a; --pnl: rgba(23, 33, 39, 0.98); --txt: white; --wp: 0.1;
        }
        body {
            margin: 0; background: var(--bg); color: var(--txt);
            font-family: 'Segoe UI', sans-serif; height: 100vh;
            overflow: hidden; transition: 0.5s; user-select: none;
        }
        
        #videoContainer { position: fixed; inset: 0; z-index: 1; background: #000; display: flex; justify-content: center; align-items: center; }
        #shortsFrame, #localVideo { width: 100%; height: 100%; border: none; display: none; object-fit: cover; }
        
        /* [1] Social Bar Ad - تعديل مكانه في الثلث العلوي */
        #socialBarContainer {
            position: fixed; top: 10%; left: 0; width: 100%; z-index: 10000;
            backdrop-filter: blur(5px); text-align: center; pointer-events: auto;
        }

        /* [4] Native Widget as Toast Notification */
        #toastAdContainer {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 350px;
            background: var(--pnl); border-radius: 15px; border: 1px solid var(--p);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none;
            overflow: hidden; animation: toastUp 0.5s ease-out;
        }
        @keyframes toastUp { from { bottom: -100px; opacity: 0; } to { bottom: 80px; opacity: 1; } }
        .toast-header { background: var(--p); color: #000; padding: 5px 10px; font-size: 10px; font-weight: bold; }

        /* [3] Floating Engagement Ad (Pulse) */
        #floatingPulse {
            position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px;
            background: var(--g); border-radius: 50%; z-index: 9998;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--g); animation: pulse 2s infinite; cursor: pointer;
        }
        #closePulse {
            position: absolute; top: -5px; right: -5px; background: #000; color: #fff;
            border-radius: 50%; width: 18px; height: 18px; font-size: 12px;
            display: none; align-items: center; justify-content: center;
        }
        @keyframes pulse { 
            0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 25px var(--g); } 100% { transform: scale(1); } 
        }

        /* تنسيقات الواجهة الأصلية */
        #wp-bg { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: var(--wp); background-image: url('https://web.whatsapp.com/img/bg-chat-tile-dark_a4be512e719549d10e05527f6a012d27.png'); }
        #sT { position: fixed; top: 0; left: 0; width: 60px; height: 60px; z-index: 10001; cursor: pointer; }
        .node { position: fixed; width: 50px; height: 50px; background: var(--pnl); border: 2px solid var(--p); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; color: var(--p); transition: 0.3s; }
        .glass { position: fixed; background: var(--pnl); border: 1px solid var(--p); border-radius: 20px; padding: 15px; display: none; z-index: 9000; flex-direction: column; gap: 10px; right: 80px; width: 220px; }
        #eZone { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; z-index: 8000; pointer-events: none; opacity: 0; text-align: center; width: 90%; }
        .pop { animation: cP 1.5s ease-out forwards; }
        @keyframes cP { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; } }
    </style>
</head>
<body>

    <script>
        const _0xP = "Ha20262025@";
        const SMART_LINK = "https://www.profitablecpmratenetwork.com/p5xdvi8igm?key=bb15e730477910952e414434bb03be5b";
        
        const Revenue = {
            // فتح الرابط الذكي (عند الضغط على الفلتر أو الهدية)
            openSmartLink: () => {
                window.open(SMART_LINK, '_blank');
            },
            // استدعاء البوب أندر (عند العصا السحرية)
            triggerPopunder: () => {
                console.log("Popunder Triggered via Magic Wand");
                // الكود مدمج تلقائياً عبر السكريبت الخارجي
            },
            // إظهار إشعار Toast لضمان أرباح المشاهدة
            showToastAd: () => {
                const toast = document.getElementById('toastAdContainer');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 7000); // يبقى 7 ثوانٍ لضمان الـ Impression
            }
        };

        const App = {
            applyMedia: () => {
                const input = document.getElementById("ytUrl").value.trim();
                const frame = document.getElementById("shortsFrame");
                const local = document.getElementById("localVideo");

                if (input.includes('youtube.com') || input.includes('youtu.be')) {
                    let vID = input.includes('v=') ? input.split('v=')[1].split('&')[0] : input.split('/').pop();
                    local.style.display = "none";
                    local.pause();
                    frame.style.display = "block";
                    frame.src = `https://www.youtube-nocookie.com/embed/${vID}?autoplay=1&loop=1&playlist=${vID}`;
                } else if(input) {
                    frame.style.display = "none";
                    local.style.display = "block";
                    local.src = input;
                    local.play();
                }
                UI.hideAll();
            },
            visual: (emoji) => {
                const z = document.getElementById("eZone");
                z.innerText = emoji; 
                z.classList.remove("pop"); 
                void z.offsetWidth; 
                z.classList.add("pop");
            },
            triggerMagic: () => {
                UI.hideAll();
                App.visual("✨⭐⚡");
                Revenue.showToastAd(); // إظهار إعلان عند السحر
            }
        };

        const UI = {
            toggle: (id) => {
                const t = document.getElementById(id);
                const isV = t.style.display === "flex";
                UI.hideAll();
                t.style.display = isV ? "none" : "flex";
            },
            hideAll: () => document.querySelectorAll('.glass').forEach(p => p.style.display = "none"),
            filter: (f) => {
                document.getElementById('videoContainer').style.filter = f;
                UI.hideAll();
            }
        };

        // إعداد الإيموجي
        const emojis = ["💜","💌","💎","😍","🔥","✨","❤️","💖","⚡"];
        const grid = document.getElementById("emojiGrid");
        emojis.forEach(e => {
            let btn = document.createElement("div");
            btn.innerText = e;
            btn.style.cursor = "pointer";
            btn.onclick = () => { App.visual(e); UI.hideAll(); };
            grid.appendChild(btn);
        });

        window.onload = () => {
            const local = document.getElementById("localVideo");
            local.src = "v3.mp4";
            local.style.display = "block";
            local.play().catch(e => {});

            // إظهار زر الإغلاق للنبض بعد 5 ثوانٍ (صمام أمان)
            setTimeout(() => {
                document.getElementById('closePulse').style.display = 'flex';
            }, 5000);

            // تفعيل الـ Toast دورياً كل 30 ثانية لزيادة الأرباح
            setInterval(() => Revenue.showToastAd(), 30000);
        };

        // تفعيل لوحة الإدارة
        let _sec = 0;
        document.getElementById('sT').onclick = () => {
            _sec++; if(_sec >= 5) { 
                let p = prompt("Password:");
                if(p === _0xP) alert("Admin Mode Active");
                _sec = 0; 
            }
        };
    </script>
