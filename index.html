<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Pro - Edition 2026</title>
    
    <script src="https://pl29310381.profitablecpmratenetwork.com/f3/f1/14/f3f11422479a989121f35119a95ea880.js"></script>
    <script src="https://pl29310384.profitablecpmratenetwork.com/1f/4d/fc/1f4dfcd01832df6433005c331053354d.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --p: #e2d1f9; --pnl: rgba(23, 33, 39, 0.98); --txt: white; --g: #ffd700;
        }
        body {
            margin: 0; background: #0b141a; color: var(--txt);
            font-family: 'Segoe UI', sans-serif; height: 100vh;
            overflow: hidden; user-select: none;
        }
        
        #videoContainer { position: fixed; inset: 0; z-index: 1; background: #000; }
        #shortsFrame, #localVideo { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* طبقة التنبيه الاحترافية (بديل الـ Iframe لزيادة الأمان) */
        #safety-overlay { position: fixed; inset: 0; z-index: 20000; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .safety-card { background: var(--pnl); border: 1px solid var(--p); padding: 30px; border-radius: 20px; max-width: 300px; }
        
        /* منطقة الإشعارات (متوافقة مع سياسة المعلنين) */
        #notify-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5000; width: 90%; pointer-events: none; }
        .system-msg { background: var(--pnl); border-right: 4px solid var(--p); padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; animation: slideUp 0.4s ease; pointer-events: auto; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* الأزرار الجانبية */
        .control-node { position: fixed; width: 48px; height: 48px; background: var(--pnl); border: 1px solid var(--p); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; color: var(--p); transition: 0.3s; }
        .menu-glass { position: fixed; background: var(--pnl); border: 1px solid var(--p); border-radius: 15px; padding: 15px; display: none; z-index: 9000; flex-direction: column; gap: 12px; right: 80px; width: 300px; box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
        
        #display-zone { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; z-index: 8000; pointer-events: none; opacity: 0; }
        .active-pop { animation: popShow 1s ease forwards; }
        @keyframes popShow { 0% { opacity:0; transform: translate(-50%, -50%) scale(0.5); } 50% { opacity:1; } 100% { opacity:0; transform: translate(-50%, -50%) scale(1.2); } }
        
        .ad-slot { width: 100%; min-height: 50px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-top: 5px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        input, button { background: #1c2a33; border: 1px solid var(--p); color: white; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; background: var(--p); color: #000; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="safety-overlay">
        <div class="safety-card">
            <i class="fas fa-shield-alt" style="font-size: 40px; color: var(--p); margin-bottom: 15px;"></i>
            <h3>تحميل المحتوى</h3>
            <p style="font-size: 14px; opacity: 0.8;">سيتم فتح صفحة المحتوى المدعومة في نافذة جديدة.</p>
            <button id="safe-btn" onclick="SystemCore.openSmartLink()">مشاهدة الآن (<span id="wait-num">5</span>)</button>
        </div>
    </div>

    <div id="videoContainer">
        <iframe id="shortsFrame" allow="autoplay; encrypted-media"></iframe>
        <video id="localVideo" controls autoplay loop playsinline></video>
    </div>

    <div id="notify-area"></div>

    <div class="control-node" style="top:130px; right:20px" onclick="AppUI.showMenu('m-video')"><i class="fas fa-video"></i></div>
    <div class="control-node" style="top:190px; right:20px" onclick="AppUI.showMenu('m-filter')"><i class="fas fa-wand-magic-sparkles"></i></div>
    <div class="control-node" style="top:250px; right:20px" onclick="AppUI.showMenu('m-emoji')"><i class="fas fa-face-smile"></i></div>

    <div id="m-video" class="menu-glass" style="top:130px">
        <input type="text" id="urlInput" placeholder="رابط فيديو يوتيوب...">
        <button onclick="CoreLogic.loadMedia()">تشغيل 🎬</button>
        <div class="ad-slot" id="native-slot"></div>
    </div>

    <div id="m-filter" class="menu-glass" style="top:190px">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <button onclick="AppUI.setFilter('hue-rotate(280deg)')">وردي</button>
            <button onclick="AppUI.setFilter('none')">إلغاء</button>
        </div>
        <div class="ad-slot" id="banner-slot" style="min-height: 250px;"></div>
    </div>

    <div id="m-emoji" class="menu-glass" style="top:250px">
        <div id="emoji-list" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; text-align: center;"></div>
    </div>

    <div id="display-zone"></div>

    <script>
        const CONFIG = {
            SMART_LINK: "https://www.profitablecpmratenetwork.com/p5xdvi8igm?key=bb15e730477910952e414434bb03be5b",
            ADMIN_KEY: "Ha20262025@"
        };

        const SystemCore = {
            // تحويل إعلان التخطي ليكون صفحة بينية (أكثر أماناً لـ Adsterra)
            showSafetyScreen: () => {
                const overlay = document.getElementById('safety-overlay');
                const btn = document.getElementById('safe-btn');
                const span = document.getElementById('wait-num');
                overlay.style.display = 'flex';
                btn.disabled = true;
                btn.style.opacity = "0.5";
                
                let count = 5;
                let timer = setInterval(() => {
                    count--;
                    span.innerText = count;
                    if(count <= 0) {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.style.opacity = "1";
                        span.innerText = "جاهز";
                    }
                }, 1000);
            },
            openSmartLink: () => {
                window.open(CONFIG.SMART_LINK, '_blank');
                document.getElementById('safety-overlay').style.display = 'none';
            },
            pushNotify: () => {
                const area = document.getElementById('notify-area');
                const msgs = [
                    {i:"🔥", t:"اكتشف المحتوى الشائع الآن"},
                    {i:"🌟", t:"مقترحات قد تهمك"},
                    {i:"✅", t:"تحديثات Studio Pro جاهزة"}
                ];
                const p = msgs[Math.floor(Math.random()*msgs.length)];
                const div = document.createElement('div');
                div.className = 'system-msg';
                div.innerHTML = `<span>${p.i}</span><span style="font-size:12px">${p.t}</span>`;
                div.onclick = () => window.open(CONFIG.SMART_LINK, '_blank');
                area.appendChild(div);
                setTimeout(() => div.remove(), 4000);
            }
        };

        const CoreLogic = {
            loadMedia: () => {
                const input = document.getElementById('urlInput').value.trim();
                SystemCore.showSafetyScreen();
                if (input.includes('youtube') || input.includes('youtu.be')) {
                    let vID = input.includes('v=') ? input.split('v=')[1].split('&')[0] : input.split('/').pop();
                    document.getElementById("localVideo").style.display = "none";
                    const f = document.getElementById("shortsFrame");
                    f.style.display = "block";
                    f.src = `https://www.youtube-nocookie.com/embed/${vID}?autoplay=1`;
                }
                AppUI.closeAll();
            }
        };

        const AppUI = {
            showMenu: (id) => {
                const m = document.getElementById(id);
                const isV = m.style.display === "flex";
                AppUI.closeAll();
                if(!isV) {
                    m.style.display = "flex";
                    AppUI.lazyAds(id);
                }
            },
            closeAll: () => document.querySelectorAll('.menu-glass').forEach(m => m.style.display = "none"),
            setFilter: (f) => document.getElementById('videoContainer').style.filter = f,
            lazyAds: (id) => {
                // تحميل البنرات عند الحاجة لضمان "جودة الظهور"
                if(id === 'm-video' && !document.getElementById('native-slot').innerHTML) {
                    const s = document.createElement('script');
                    s.src = "https://pl29310385.profitablecpmratenetwork.com/00e55bc0936560b403e88e60248cee97/invoke.js";
                    document.getElementById('native-slot').appendChild(s);
                    const d = document.createElement('div'); d.id = "container-00e55bc0936560b403e88e60248cee97";
                    document.getElementById('native-slot').appendChild(d);
                }
                if(id === 'm-filter' && !document.getElementById('banner-slot').innerHTML) {
                    const ifr = document.createElement('iframe');
                    ifr.style = "width:300px;height:250px;border:none;";
                    document.getElementById('banner-slot').appendChild(ifr);
                    const d = ifr.contentWindow.document;
                    d.open();
                    d.write(`<script>atOptions={'key':'ecd37eb3b51978e4cf1c88fb23e69e0b','format':'iframe','height':250,'width':300,'params':{}};\x3C/script><script src="https://www.highperformanceformat.com/ecd37eb3b51978e4cf1c88fb23e69e0b/invoke.js"><\/script>`);
                    d.close();
                }
            }
        };

        // الإيموجي
        const emojis = ["💜","💎","✨","🔥","💖","⚡"];
        emojis.forEach(e => {
            const d = document.createElement('div');
            d.innerText = e; d.style.cursor = "pointer"; d.style.fontSize = "25px";
            d.onclick = () => {
                const z = document.getElementById('display-zone');
                z.innerText = e; z.classList.remove('active-pop'); void z.offsetWidth; z.classList.add('active-pop');
                SystemCore.pushNotify();
                AppUI.closeAll();
            };
            document.getElementById('emoji-list').appendChild(d);
        });

        window.onload = () => {
            const v = document.getElementById('localVideo');
            v.src = "v3.mp4"; v.style.display = "block"; v.play().catch(()=>{});
            
            // توقيتات الربح (أكثر أماناً لضمان عدم الحظر)
            setInterval(() => SystemCore.showSafetyScreen(), 180000); // كل 3 دقائق
            setInterval(() => SystemCore.pushNotify(), 50000); // كل 50 ثانية
        };
    </script>
</body>
</html>
