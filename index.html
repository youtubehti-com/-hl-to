<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Pro - Clean Edition</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --p: #e2d1f9; --pk: #ffdae9; --g: #ffd700; --b: #00d2ff;
            --bg: #0b141a; --pnl: rgba(23, 33, 39, 0.98); --txt: white;
        }
        body {
            margin: 0; background: var(--bg); color: var(--txt);
            font-family: 'Segoe UI', sans-serif; 
            overflow-y: auto; 
            user-select: none;
        }
        
        #mainContent {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #videoContainer { 
            width: 100%; 
            height: 80vh; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            position: relative;
        }

        #shortsFrame, #localVideo { width: 100%; height: 100%; border: none; display: none; object-fit: cover; }
        
        .ad-section { width: 100%; display: flex; justify-content: center; padding: 15px 0; background: #000; }

        /* واجهة التحكم */
        #sT { position: fixed; top: 0; left: 0; width: 60px; height: 60px; z-index: 10001; cursor: pointer; }
        .node { position: fixed; width: 50px; height: 50px; background: var(--pnl); border: 2px solid var(--p); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; color: var(--p); transition: 0.3s; }
        .glass { position: fixed; background: var(--pnl); border: 1px solid var(--p); border-radius: 20px; padding: 15px; display: none; z-index: 9000; flex-direction: column; gap: 10px; right: 80px; width: 220px; }
        
        /* منطقة الإيموجي الكبير - تعديل الحجم والتأثير */
        #eZone { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0); 
            font-size: 80px; /* حجم كبير جداً عند الظهور */
            z-index: 8000; 
            pointer-events: none; 
            opacity: 0; 
            text-align: center; 
            width: 100%; 
        }
        .pop { animation: cP 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes cP { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
            30% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } 
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } 
        }
    </style>
</head>
<body>

    <script src="https://pl29310384.profitablecpmratenetwork.com/1f/4d/fc/1f4dfcd01832df6433005c331053354d.js"></script>

    <div id="sT"></div>

    <div id="mainContent">
        <div id="videoContainer">
            <iframe id="shortsFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            <video id="localVideo" controls autoplay loop playsinline></video>
        </div>

        <div class="ad-section">
            <div id="container-00e55bc0936560b403e88e60248cee97"></div>
            <script async="async" data-cfasync="false" src="https://pl29310385.profitablecpmratenetwork.com/00e55bc0936560b403e88e60248cee97/invoke.js"></script>
        </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="node" style="top:100px; right:20px" onclick="UI.toggle('pSettings')"><i class="fas fa-video"></i></div>
        <div class="node" style="top:160px; right:20px" onclick="UI.toggle('pFilter')"><i class="fas fa-filter"></i></div>
        <div class="node" style="top:220px; right:20px; color:var(--g); border-color:var(--g)" onclick="App.triggerMagic()"><i class="fas fa-wand-sparkles"></i></div>
        <div class="node" style="top:280px; right:20px" onclick="UI.toggle('pEmoji')"><i class="fa-solid fa-face-smile"></i></div>
    </div>

    <div id="pSettings" class="glass" style="top:100px">
        <input type="text" id="ytUrl" placeholder="رابط يوتيوب...">
        <button onclick="App.applyMedia()">تشغيل 🎬</button>
    </div>

    <div id="pFilter" class="glass" style="top:160px">
        <button onclick="UI.filter('hue-rotate(280deg)')">🌸 فلتر وردي</button>
        <button onclick="UI.filter('sepia(0.8)')">🎞️ كلاسيك</button>
        <button onclick="UI.filter('none')">❌ إلغاء</button>
    </div>

    <div id="pEmoji" class="glass" style="top:280px">
        <div id="emojiGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
    </div>

    <div id="eZone"></div>

    <script>
        const _0xP = "Ha20262025@";
        
        const App = {
            applyMedia: () => {
                const input = document.getElementById("ytUrl").value.trim();
                const frame = document.getElementById("shortsFrame");
                const local = document.getElementById("localVideo");

                if (input.includes('youtube.com') || input.includes('youtu.be')) {
                    let vID = input.includes('v=') ? input.split('v=')[1].split('&')[0] : input.split('/').pop();
                    local.style.display = "none";
                    local.pause();
                    frame.style.display = "block";
                    frame.src = `https://www.youtube-nocookie.com/embed/${vID}?autoplay=1&loop=1&playlist=${vID}`;
                } else if(input) {
                    frame.style.display = "none";
                    local.style.display = "block";
                    local.src = input;
                    local.play();
                }
                UI.hideAll();
            },
            visual: (emoji) => {
                const z = document.getElementById("eZone");
                z.innerText = emoji; 
                z.classList.remove("pop"); 
                void z.offsetWidth; // إعادة تشغيل الأنيميشن
                z.classList.add("pop");
            },
            triggerMagic: () => {
                UI.hideAll();
                App.visual("✨⭐⚡");
            }
        };

        const UI = {
            toggle: (id) => {
                const t = document.getElementById(id);
                const isV = t.style.display === "flex";
                UI.hideAll();
                t.style.display = isV ? "none" : "flex";
            },
            hideAll: () => document.querySelectorAll('.glass').forEach(p => p.style.display = "none"),
            filter: (f) => {
                document.getElementById('videoContainer').style.filter = f;
                UI.hideAll();
            }
        };

        const emojis = ["💜","💌","💎","😍","🔥","✨","❤️","💖","⚡"];
        const grid = document.getElementById("emojiGrid");
        emojis.forEach(e => {
            let btn = document.createElement("div");
            btn.innerText = e;
            btn.style.cursor = "pointer";
            btn.style.fontSize = "24px";
            btn.onclick = () => { App.visual(e); UI.hideAll(); };
            grid.appendChild(btn);
        });

        window.onload = () => {
            const local = document.getElementById("localVideo");
            local.src = "v3.mp4";
            local.style.display = "block";
            local.play().catch(e => {});
        };

        let _sec = 0;
        document.getElementById('sT').onclick = () => {
            _sec++; if(_sec >= 5) { 
                let p = prompt("Password:");
                if(p === _0xP) alert("Admin Mode Active");
                _sec = 0; 
            }
        };
    </script>
</body>
</html>
